<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TLS Expiry</title>
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Domain">
    <sdpi-textfield setting="domain" required placeholder="example.com"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="Port">
    <sdpi-textfield setting="port" placeholder="443"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="Label">
    <sdpi-textfield setting="label" placeholder="default: domain"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="Style">
    <sdpi-select setting="theme" global default="glass">
      <option value="glass">Glass</option>
      <option value="mono">Mono</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Language">
    <sdpi-select setting="language" global default="en">
      <option value="en">English</option>
      <option value="ru">Русский</option>
    </sdpi-select>
  </sdpi-item>
  <script src="pi-i18n.js"></script>
</body>
</html>
